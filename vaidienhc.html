.info-frame{
    position: relative;
    width:94%;
    max-width:1550px;
    margin:40px auto;
    padding:45px 10px;
    min-height: 650px;
    height: 650px;
    background-image:url("img/nenthongtin.jpg");
    background-repeat:no-repeat;
    background-size:100% 100%;
    background-position:center 50px; /* dịch xuống 30px */
}
.pham-grid{
    position: relative;
    margin-top: 40px;
}

.pham-row{
    display:flex;
    justify-content:center;
    align-items:flex-start;
    gap:-50px;              /* khoảng cách giữa các ảnh */
    width:100%;
    margin-bottom:40px;
}

.bottom-row{
    margin-top:-20px;   /* nếu muốn chỉ chỉnh khoảng cách với hàng trên */
}
.pham-item{
    display: flex;
    flex-direction: column;
    align-items: center;
}

.pham-item img{
    width:250px;
    height:auto;
    display:block;
    margin-top:-50px;
}

.pham-item button{
    margin-top:-70px;
    border:none;
    background:#b5953f;
    color:white;
    padding:8px 30px;
    border-radius:30px;
    font-size:17px;
    font-family:"Alegreya",serif;
    cursor:pointer;
}

.pham-item button:hover{
    background:#9f7d25;
}
.pham-btn{
    min-width: 140px;      /* nhỏ hơn */

    font-size: 18px;
    border-radius: 25px;
}
.overlay{

    position:fixed;

        <script>
let currentPage = 1;

function nextPage() {
    if (currentPage === 1) {
        document.querySelector(".info-frame").style.backgroundImage =
            "url('img/nenthongtin.jpg')";

        currentPage = 2;
    }
}

function prevPage() {
    if (currentPage === 2) {
        document.querySelector(".info-frame").style.backgroundImage =
            "url('img/nenthongtin.jpg')";

        currentPage = 1;
    }
}
function closeInfo(){
    document.getElementById("overlay").style.display = "none";
    document.getElementById("infoBox").style.display = "none";
}
function nextPage() {
    document.getElementById("page1").style.display = "none";
    document.getElementById("page2").style.display = "block";
}

function prevPage() {
    document.getElementById("page2").style.display = "none";
    document.getElementById("page1").style.display = "block";
}

</script>
