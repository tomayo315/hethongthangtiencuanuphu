    <style>
        .info-frame{
    position: relative;
    width:94%;
    max-width:1550px;
    margin:40px auto;
    padding:45px 10px;
    min-height: 650px;
    height: 650px;
    background-image:url("img/nenthongtin.jpg");
    background-repeat:no-repeat;
    background-size:100% 100%;
    background-position:center 50px; /* dịch xuống 30px */
}
.pham-grid{
    position: relative;
    margin-top: 20px;
}

.pham-row{
    display:flex;
    justify-content:flex-start;
    align-items:flex-start;
    gap:0;              /* hoặc 5px nếu muốn có khe nhỏ */
    padding-left:20px;
    margin-bottom:60px;
}
.pham-item{
    display:flex;
    flex-direction:column;
    align-items:center;
    margin-right:20px;   /* kéo các ảnh lại gần nhau */
}

.pham-item img{
    width:250px;
    height:auto;
    display:block;
}
.pham-item .pham-btn{
    margin-top:-80px;
    border:none;
    background:#b5953f;
    color:white;
    padding:8px 30px;
    border-radius:30px;
    font-size:17px;
    font-family:"Alegreya",serif;
    cursor:pointer;
}
.pham-item .pham-btncc{
    margin-top:-80px;
    border:none;
    background:#75746f;
    color:white;
    padding:8px 30px;
    border-radius:30px;
    font-size:17px;
    font-family:"Alegreya",serif;
    cursor:pointer;
}

.pham-item button{
    margin-top:-100px;
    border:none;
    background:#b5953f;
    color:white;
    padding:8px 30px;
    border-radius:30px;
    font-size:17px;
    font-family:"Alegreya",serif;
    cursor:pointer;
}

.pham-item button:hover{
    background:#585651;
}
.pham-btn{
    min-width: 140px;      /* nhỏ hơn */
    padding: 6px 18px;
    font-size: 18px;
    border-radius: 25px;
}
.overlay{
    display:none;
    position:fixed;
    inset:0;
    z-index:9998;
}
.character-info{
    display:none;
    width:94%;
    max-width:1550px;
    margin:30px auto;
}

.info-img{
    width:100%;
    display:block;
    margin-bottom:25px;
}
/* ================= MOBILE ================= */
/* ================= MOBILE ================= */
@media (max-width: 768px) {

    .info-frame {
        width: 96%;
        min-height: 600px;
        height: auto;
        margin: 20px auto;
        padding: 30px 5px 50px;
        box-sizing: border-box;

        background-size: 100% 100%;
        background-position: center top;
    }

    .pham-grid {
        width: 100%;
        margin-top: 20px;

        /* Dịch toàn bộ bảng sang trái */
        transform: translateX(-25px);
    }

    /* ================= 2 TRÊN - 1 DƯỚI ================= */

    .pham-row {
        display: grid;

        grid-template-columns: 1fr 1fr;
        grid-template-rows: auto auto;

        width: 100%;
        padding: 0;
        margin: 0;

        /* giảm khoảng cách */
        column-gap: 0;
        row-gap: 20px;

        justify-items: center;
        align-items: start;
    }

    .pham-item {
        width: 100%;

        display: flex;
        flex-direction: column;
        align-items: center;

        margin: 0;
        padding: 0;

        box-sizing: border-box;
    }

    /* ================= ẢNH ================= */

    .pham-item img {
        width: 220px;
        max-width: 220px;
        height: auto;

        display: block;

        margin: 0 auto;
    }

    /* ================= ẢNH THỨ 3 NẰM GIỮA ================= */

    .pham-item:nth-child(3) {
        grid-column: 1 / 3;
        justify-self: center;

        width: 50%;
    }

    /* ================= NÚT ================= */

    .pham-item .pham-btn,
    .pham-item .pham-btncc,
    .pham-item button {

        width: 110px;
        min-height: 38px;

        margin-top: -70px;

        padding: 5px 5px;

        border: none;
        border-radius: 20px;

        font-family: "Alegreya", serif;
        font-size: 12px;
        line-height: 1.2;

        box-sizing: border-box;
    }

    .pham-item .pham-btn {
        background: #b5953f;
    }

    .pham-item .pham-btncc {
        background: #75746f;
    }

    /* ================= THÔNG TIN ================= */

    .character-info {
        width: 96%;
        margin: 20px auto;
    }

    .info-img {
        width: 100%;
        height: auto;
        display: block;
        margin-bottom: 15px;
    }
}
    </style>
