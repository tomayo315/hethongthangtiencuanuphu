/* =========================
   CẬP NHẬT ĐIỂM THÁNG TIẾN
========================= */

.capnhat-container {
    width:94%;
    max-width:1550px;
    margin:40px auto;
    padding:45px;
    height: 700px;
    background-image:url("img/nenthongtin.jpg");
    background-repeat:no-repeat;
    background-size:100% 100%;
    background-position:center 50px;
}

.capnhat-title {
    text-align: center;
    color: #a1832e;
    font-size: 28px;
    font-weight: 800;
    margin: 0 0 65px;
}
.capnhat-container h1 {
    font-family: 'Alegreya', serif;
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 10px;
    margin-top: 50px;
}

.capnhat-form {
    width: 72%;
    max-width: 1200px;
    margin: auto;
    margin-top: 40px;
}

.form-row {
    display: flex;
    align-items: center;
    margin-bottom: 65px;
}

.form-row label {
    width: 42%;
    color: #aaa899;
    font-size: 28px;
    font-weight: 400;
}

.form-row input {
    width: 48%;
    height: 70px;
    border: 3px solid #e7e3d5;
    border-radius: 15px;
    background: #f3f1e7;
    outline: none;

    padding: 0 25px;

    font-family: 'Alegreya', serif;
    font-size: 28px;
    color: #6f663f;

    box-shadow: inset 0 1px 5px rgba(0,0,0,0.03);
}

.form-row input:focus {
    border-color: #c4ae6b;
    background: #f8f6ed;
}


/* Nút cập nhật */

.capnhat-button {
    display: block;
    margin: 5px auto 5px;

    padding: 14px 55px;

    border: none;
    border-radius: 12px;

    background: #a1832e;
    color: white;

    font-family: 'Alegreya', serif;
    font-size: 25px;
    font-weight: 700;

    cursor: pointer;

    transition: 0.2s;
}

.capnhat-button:hover {
    background: #8c7025;
    transform: translateY(-2px);
}


/* Thông báo */

#message {
    text-align: center;
    font-family: 'Alegreya', serif;
    font-size: 25px;
    min-height: 40px;
    margin-top: 15px;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 768px) {

    .capnhat-container {
        width: 94%;
        max-width: none;
        height: calc(100vh - 175px);
        min-height: 0;

        margin: 20px auto 0;
        padding: 25px 15px;

        background-size: 100% 100%;
        background-position: center top;

        box-sizing: border-box;
    }

    .capnhat-title {
        font-size: 25px;
        margin: 10px 0 35px;
        padding: 0;
        line-height: 1.3;
    }

    .capnhat-container h1 {
        font-size: 25px;
        margin-top: 10px;
        margin-bottom: 35px;
    }

    .capnhat-form {
        width: 100%;
        max-width: none;
        margin: 0 auto;
    }

    .form-row {
        display: block;
        width: 100%;
        margin-bottom: 25px;
    }

    .form-row label {
        display: block;
        width: 100%;

        font-size: 21px;
        margin-bottom: 8px;

        line-height: 1.3;
    }

    .form-row input {
        display: block;
        width: 100%;
        height: 55px;

        box-sizing: border-box;

        padding: 0 15px;

        font-size: 20px;

        border: 2px solid #e7e3d5;
        border-radius: 12px;
    }

    .capnhat-button {
        margin: 20px auto 5px;

        padding: 10px 30px;

        font-size: 20px;

        border-radius: 10px;
    }

    #message {
        font-size: 18px;
        min-height: 30px;
        margin-top: 10px;
    }
}

           <div class="capnhat-container">

    <h1 class="capnhat-title">
        CẬP NHẬT ĐIỂM THĂNG TIẾN
    </h1>

    <div class="capnhat-form">

        <div class="form-row">
            <label for="username">
                Tên người chơi:
            </label>

            <input
                type="text"
                id="username"
                autocomplete="username"
            >
        </div>


        <div class="form-row">
            <label for="password">
                Mật khẩu người chơi:
            </label>

            <input
                type="password"
                id="password"
                autocomplete="current-password"
            >
        </div>


        <div class="form-row">
            <label for="score">
                Cập nhật số điểm tháng tiến:
            </label>

            <input
                type="number"
                id="score"
                min="0"
                placeholder=""
            >
        </div>


        <button
            type="button"
            class="capnhat-button"
            onclick="updateScore()"
        >
            CẬP NHẬT
        </button>


        <div id="message"></div>

    </div>

            <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
            <script>

const SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbxz1JBN82-xhdMZ5YbkaVkDZpJOAhd7UI5CWGXM1ijmUAHmpgymZQHgWH5BdfrrFyKw/exec";


function updateScore() {

    const username =
        document.getElementById("username").value.trim();

    const password =
        document.getElementById("password").value.trim();

    const score =
        document.getElementById("score").value.trim();

    const message =
        document.getElementById("message");


    // Kiểm tra nhập đủ
    if (username === "" ||
        password === "" ||
        score === "") {

        message.style.color = "red";
        message.textContent =
            "Vui lòng nhập đầy đủ thông tin.";

        return;
    }


    message.style.color = "#a1832e";
    message.textContent = "Đang cập nhật...";


    fetch(SCRIPT_URL, {

        method: "POST",

        body: JSON.stringify({

            username: username,

            password: password,

            score: Number(score)

        })

    })


    .then(response => response.json())


    .then(data => {

        if (data.success) {

            message.style.color = "green";

            message.textContent =
                data.message;


            // Xóa ô điểm
            document.getElementById("score").value = "";

        }

        else {

            message.style.color = "red";

            message.textContent =
                data.message;

        }

    })


    .catch(error => {

        console.error(error);

        message.style.color = "red";

        message.textContent =
            "Không thể kết nối Google Sheet.";

    });

}

</script>
