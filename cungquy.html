<style>
        

        .timeline-box{
            position:relative;
            width:94%;
            max-width:1550px;
            margin:90px auto;
            background:#f3e3cc;
            padding:60px;
            min-height:630px;
            margin-bottom: 20px;
        }

.timeline-grid{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-top:20px;
}

.row-line{
    display:flex;
    align-items:center;
    justify-content:center;
}

.line{
    width:120px;
    height:1.3px;
    background:#fff;
}

.node{
    width:130px;
    height:230px;
    background:#e8cb73;
    color:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    font-size:35px;
    font-weight:bold;
    clip-path:polygon(
        50% 0,
        100% 22%,
        100% 78%,
        50% 100%,
        0 78%,
        0 22%
    );
    border:1px solid #fff;      /* viền trắng */
    box-sizing:border-box;
}
.info-box{
    display:none;
    position:absolute;

    top:0;
    left:0;

    width:100%;
    height:100%;

    padding:30px 40px 40px;

    background:#f3e3cc;   /* giống timeline-box */
    border:none;          /* bỏ viền */
    box-shadow:none;      /* bỏ bóng nếu có */
    z-index:10;
}

.back-btn{
    position:absolute;
    top:5px;
    left:5px;

    width:40px;
    height:40px;

    border:none;
    border-radius:50%;

    background:#b9963d;
    color:#fff;

    font-size:20px;
    font-weight:bold;
    line-height:50px;
    text-align:center;

    cursor:pointer;
    transition:.25s;

    display:flex;
    justify-content:center;
    align-items:center;
    box-shadow:
        inset 0 2px 3px rgba(255,255,255,.35),
        0 3px 6px rgba(0,0,0,.25);
}

.back-btn:hover{
    background:#c9a74b;
    transform:scale(1.08);
}

.node span{
    line-height:1.5;
}
.year-detail{
    display:flex;
    gap:60px;
}

.year-left{
    width:120px;
    position:relative;
    display:flex;
    justify-content:center;
    align-items:flex-start;
}

/* Đường trắng chạy xuyên suốt */
.year-left::before{
    content:"";
    position:absolute;
    left:50%;
    transform:translateX(-50%);

    top:-999px;
    bottom:-999px;

    width:3px;
    background:#fff;
    z-index:1;
}
.info-box{
    overflow:hidden;
}


.rank-detail{
    color:#8f7424;
    font-size:24px;
    line-height:1.3;
}

.rank-detail h3{
    color:#8f7424;
    font-size:34px;
    font-weight:700;
    margin-bottom:18px;
    margin-left: 20px;
}

.rank-detail ul{
    margin-left:0px;
    margin-bottom:15px;
}

.rank-detail li{
    margin-bottom:15px;
}

.rank-detail b{
    color:#7b631d;
}
.page-nav{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:45px;
    height:45px;
    border:none;
    border-radius:50%;
    background:#b9963d;
    color:#fff;
    font-size:28px;
    cursor:pointer;
    display:none;
    justify-content:center;
    align-items:center;
    z-index:20;
}

.page-nav:hover{
    background:#c9a74b;
}

#prevPage{
    left:15px;
}

#nextPage{
    right:15px;
}
@media (max-width:768px){
    .timeline-box{
    width:96%;
    margin:35px auto 15px;
    padding:15px;
    min-height:auto;
}
.timeline-box.show-info{
    width:100%;
    min-height:650px;
    margin:75px 0 0;
    padding:15px;
}
.info-box{
    position:absolute;
    top:0px;
    left:0;

    width:100%;
    min-height:650px;

    padding:100px 20px 30px;

    overflow-y:auto;
}

.timeline-grid{
    gap:8px;
    margin-top:0;
}

.row-line{
    gap:0;
    overflow-x:auto;
    justify-content:flex-start;
    padding:5px 0;
    overflow-x:hidden;
}

.node{
    width:75px;
    height:130px;
    font-size:20px;
    flex-shrink:0;
    outline: none;
}

.node span{
    line-height:1.3;
}

.line{
    width:25px;
    flex-shrink:0;
}

.info-box{
        padding:55px 25px 30px;
    }

    .rank-detail{
        font-size:20px;
        line-height:1.8;
    }

    .rank-detail h3{
        font-size:28px;
        margin-bottom:18px;
    }

    .rank-detail li{
        margin-bottom:18px;
    }

.page-nav{
    position:fixed;
    top:50%;
    transform:translateY(-50%);
    width:36px;
    height:36px;
    font-size:20px;
    z-index:100;
}

#prevPage{
    left:5px;
}

#nextPage{
    right:5px;
}

.back-btn{
    position:fixed;
    top:165px;
    left:6px;
    width:34px;
    height:34px;
    font-size:18px;
    z-index:100;
}
}


</style>

    document.getElementById("infoBox").style.display="block";

    renderPage();
}

if(currentPage==1){

           if(currentPage==1){

if(currentPage==1){
